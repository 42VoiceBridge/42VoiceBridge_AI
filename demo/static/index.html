<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구음장애 보조 인식 시연</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#dcdcd6;--acc:#1f5fbf;--ok:#1d7a46;--warn:#a15c00;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#20201e;--ink:#ecebe6;--mute:#a3a29b;--line:#3a3a36;--acc:#7aa7f0;--ok:#5cc38a;--warn:#e0a24a;--bad:#f08a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:14px;color:var(--mute)}
select,button,input[type=file]{font:inherit}
select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
button{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button.rec{border-color:var(--bad);color:var(--bad)}
textarea{width:100%;min-height:96px;font-size:24px;line-height:1.4;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.meta{font-size:12.5px;color:var(--mute);margin-top:8px;word-break:break-all}
.ref{font-size:15px;margin-top:8px}
.state{font-size:14px;font-weight:600;margin:8px 0}
.state.ok{color:var(--ok)}.state.warn{color:var(--warn)}.state.bad{color:var(--bad)}
audio{width:100%;margin-top:8px}
.note{font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>확인한 문장만 읽어주는 인식기 (시연)</h1>
  <div class="sub" id="engine">서버 확인 중…</div>

  <div class="card">
    <div class="row">
      <label for="user">사용자</label>
      <select id="user"></select>
      <label><input type="checkbox" id="useAdapter" checked> 개인 어댑터 사용</label>
    </div>
    <div class="note" id="adapterNote"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="rec" class="rec">녹음 시작</button>
      <input type="file" id="file" accept="audio/*">
    </div>
    <div class="row" style="margin-top:8px">
      <label for="sample">데이터셋 샘플</label>
      <select id="sample"><option value="">— 선택 —</option></select>
    </div>
    <audio id="player" controls hidden></audio>
    <div class="row" style="margin-top:10px">
      <button id="go" class="primary" disabled>인식</button>
    </div>
  </div>

  <div class="card">
    <textarea id="text" placeholder="인식 결과가 여기에 나옵니다. 틀린 곳은 직접 고칠 수 있습니다." disabled></textarea>
    <div class="state" id="state"></div>
    <div class="row">
      <button id="confirm" class="primary" disabled>이 문장이 맞아요</button>
      <button id="speak" disabled>읽어주기</button>
      <button id="cancel" disabled>취소</button>
    </div>
    <div class="ref" id="ref" hidden></div>
    <div class="meta" id="meta"></div>
  </div>

  <p class="note">시연용 파일럿입니다. 음성은 확인 버튼을 누른 문장만 재생됩니다. 인식 결과의 정확도는 보장되지 않으며, 표시된 수치는 검증 전입니다.</p>
</main>
<script>
const $ = id => document.getElementById(id);
let wavBlob = null, tx = null, conf = null, dirty = false, sampleRef = null, health = null;

function setState(msg, cls){ const s=$('state'); s.textContent=msg||''; s.className='state '+(cls||''); }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()); }

async function api(path, opt){
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({error:{code:'bad_response',message:String(r.status)}}));
  if(!r.ok) throw j.error || {code:String(r.status), message:'error'};
  return j;
}

async function init(){
  try{
    health = await api('/v1/health');
    $('engine').textContent = `엔진 ${health.engine} · 기본 모델 ${health.base_model} · beam ${health.beam_size} · 계약 ${health.contract_version}`;
  }catch(e){ $('engine').textContent='서버에 연결할 수 없습니다: '+(e.message||e.code); return; }
  const users = [{id:'guest', label:'guest (개인 어댑터 없음)'}];
  for(const a of health.adapters) users.push({id:a.user_id, label:`${a.user_id} — ${a.label||'개인 어댑터'}`});
  $('user').innerHTML = users.map(u=>`<option value="${u.id}">${u.label}</option>`).join('');
  $('user').onchange = showAdapter; showAdapter();
  try{
    const s = await api('/samples/samples.json');
    $('sample').innerHTML += s.map((x,i)=>`<option value="${i}">${x.speaker} · ${x.split} · ${x.text}</option>`).join('');
    $('sample').onchange = async ()=>{
      const x = s[$('sample').value]; if(!x) return;
      const b = await (await fetch('/samples/'+x.file)).blob();
      sampleRef = x.text; setAudio(b, true);
      const opt=[...$('user').options].find(o=>o.value===x.speaker); if(opt){ $('user').value=x.speaker; showAdapter(); }
    };
  }catch(e){ $('sample').disabled = true; }
}

function showAdapter(){
  const a = health.adapters.find(a=>a.user_id===$('user').value);
  $('adapterNote').textContent = a
    ? `어댑터 ${a.adapter_id} · ${(a.size_bytes/1e6).toFixed(1)} MB · ${a.evidence||'근거: 파일럿, 검증 전'}`
    : '이 사용자는 개인 어댑터가 없습니다. 기본 모델로 인식합니다.';
  $('useAdapter').disabled = !a;
}

// ---------- audio: any browser-decodable input -> 16 kHz mono PCM16 WAV
async function toWav16k(blob){
  const buf = await blob.arrayBuffer();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const src = await ac.decodeAudioData(buf.slice(0));
  ac.close && ac.close();
  const n = Math.ceil(src.duration*16000);
  const off = new OfflineAudioContext(1, n, 16000);
  const node = off.createBufferSource(); node.buffer = src; node.connect(off.destination); node.start();
  const out = (await off.startRendering()).getChannelData(0);
  const pcm = new DataView(new ArrayBuffer(44 + out.length*2));
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) pcm.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); pcm.setUint32(4,36+out.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  pcm.setUint32(16,16,true); pcm.setUint16(20,1,true); pcm.setUint16(22,1,true);
  pcm.setUint32(24,16000,true); pcm.setUint32(28,32000,true); pcm.setUint16(32,2,true); pcm.setUint16(34,16,true);
  w(36,'data'); pcm.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++){ const v=Math.max(-1,Math.min(1,out[i])); pcm.setInt16(44+i*2, v<0?v*0x8000:v*0x7fff, true); }
  return new Blob([pcm.buffer], {type:'audio/wav'});
}

async function setAudio(blob, keepRef){
  if(!keepRef){ sampleRef = null; $('sample').value=''; }
  try{ wavBlob = await toWav16k(blob); }catch(e){ setState('이 파일은 읽을 수 없습니다.', 'bad'); return; }
  $('player').src = URL.createObjectURL(wavBlob); $('player').hidden = false;
  $('go').disabled = false; resetResult();
}

let mr = null, chunks = [];
$('rec').onclick = async ()=>{
  if(mr && mr.state==='recording'){ mr.stop(); return; }
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio:true});
    mr = new MediaRecorder(st); chunks=[];
    mr.ondataavailable = e=>chunks.push(e.data);
    mr.onstop = ()=>{ st.getTracks().forEach(t=>t.stop()); $('rec').textContent='녹음 시작'; setAudio(new Blob(chunks,{type:mr.mimeType})); };
    mr.start(); $('rec').textContent='녹음 정지';
  }catch(e){ setState('마이크를 쓸 수 없습니다: '+e.message, 'bad'); }
};
$('file').onchange = e=>{ const f=e.target.files[0]; if(f) setAudio(f); };

function resetResult(){
  tx=null; conf=null; dirty=false;
  $('text').value=''; $('text').disabled=true; $('meta').textContent=''; setState('');
  ['confirm','speak','cancel'].forEach(b=>$(b).disabled=true);
  $('ref').hidden = !sampleRef; $('ref').textContent = sampleRef ? '데이터셋 라벨(의도 기준 전사): '+sampleRef : '';
}

$('go').onclick = async ()=>{
  if(!wavBlob) return;
  resetResult(); setState('인식 중…'); $('go').disabled=true;
  const q = new URLSearchParams({user_id:$('user').value, use_adapter:String($('useAdapter').checked && !$('useAdapter').disabled), request_id:uuid()});
  try{
    tx = await api('/v1/asr/transcribe?'+q, {method:'POST', headers:{'Content-Type':'audio/wav'}, body:wavBlob});
    $('text').value = tx.text; $('text').disabled=false;
    const m = tx.model;
    $('meta').textContent = `모델 ${m.base_model}${m.adapter_id? ' + 어댑터 '+m.adapter_id : ' (어댑터 없음)'} · ${tx.audio.duration_sec}s · ${tx.latency_ms} ms · 후보 ${tx.alternatives.length}개 · 점수 ${tx.score===null?'없음':tx.score}`;
    if(tx.status==='no_speech'){ setState('말소리를 찾지 못했습니다. 다시 녹음해 주세요.', 'warn'); }
    else { setState('맞는지 확인해 주세요. 틀린 곳은 고친 뒤 확인을 누르세요.', 'warn'); $('confirm').disabled=false; }
    $('cancel').disabled=false;
  }catch(e){ setState('인식 실패: '+(e.message||e.code), 'bad'); }
  $('go').disabled=false;
};

$('text').oninput = ()=>{
  if(conf){ dirty=true; $('speak').disabled=true; setState('문장이 바뀌었습니다. 다시 확인해야 읽을 수 있습니다.', 'warn'); }
  $('confirm').disabled = !$('text').value.trim();
};

$('confirm').onclick = async ()=>{
  try{
    conf = await api(`/v1/transcriptions/${tx.transcription_id}/confirm`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({revision:tx.revision, confirmed_text:$('text').value, consent:{store_audio:false, use_for_training:false}})});
    dirty=false; $('speak').disabled=false;
    setState(conf.source==='user_edited' ? `확인됨 (직접 고침, ${conf.edit_distance_syl}음절 수정)` : '확인됨', 'ok');
  }catch(e){ setState('확인 실패: '+(e.message||e.code), 'bad'); }
};

$('speak').onclick = async ()=>{
  if(!conf || dirty) return;
  $('speak').disabled = true;
  try{
    const t = await api('/v1/tts', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({confirmation_id:conf.confirmation_id, idempotency_key:uuid()})});
    const u = new SpeechSynthesisUtterance(t.text); u.lang='ko-KR';
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('ko'));
    if(v) u.voice=v; else setState('이 브라우저에 한국어 음성이 없습니다.', 'warn');
    u.onend = ()=>{ $('speak').disabled = dirty; };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ setState('읽기 거부: '+(e.message||e.code), 'bad'); $('speak').disabled=false; }
};

$('cancel').onclick = ()=>{ speechSynthesis.cancel(); resetResult(); setState('취소했습니다.'); };
init();
</script>
</body>
</html>
