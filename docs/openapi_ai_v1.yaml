openapi: 3.0.3
info:
  title: AI inference server (구음장애 보조)
  version: ai-contract-v1
  description: >
    Machine-readable form of docs/AI_BACKEND_CONTRACT_v1_EN.md. The prose document is
    authoritative for rules (confirmation gate, consent, adapter binding); this file fixes
    shapes. Reference implementation: demo/server.py.
servers:
  - url: http://127.0.0.1:8000
paths:
  /v1/health:
    get:
      summary: Engine, model versions, loaded adapters, input limits
      responses:
        "200":
          description: ok
          content: {application/json: {schema: {$ref: "#/components/schemas/Health"}}}
  /v1/asr/transcribe:
    post:
      summary: Recognize one utterance (WAV PCM16 mono 16 kHz, 0.3-30 s)
      parameters:
        - {name: user_id, in: query, required: true, schema: {type: string}}
        - {name: use_adapter, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: request_id, in: query, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          audio/wav:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: recognition result (status ok or no_speech)
          content: {application/json: {schema: {$ref: "#/components/schemas/Transcription"}}}
        "400": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/transcriptions/{transcription_id}/confirm:
    post:
      summary: Confirm (optionally edited) text. Backend-owned in the product.
      parameters:
        - {name: transcription_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConfirmRequest"}
      responses:
        "200":
          description: confirmation
          content: {application/json: {schema: {$ref: "#/components/schemas/Confirmation"}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/tts:
    post:
      summary: Obtain the only text the client may speak. Backend-owned in the product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation_id, idempotency_key]
              properties:
                confirmation_id: {type: string, format: uuid}
                idempotency_key: {type: string}
      responses:
        "200":
          description: text to speak (replayed=true on retry with the same key)
          content: {application/json: {schema: {$ref: "#/components/schemas/Tts"}}}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/analysis/jamo-errors:
    post:
      summary: Jamo-level MODEL-error statistics (jamo-err-v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairs]
              properties:
                pairs:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [ref, hyp]
                    properties:
                      ref: {type: string, description: "known prompt or independent human correction; never model output"}
                      hyp: {type: string}
                min_support: {type: integer, default: 20}
      responses:
        "200":
          description: statistics
          content: {application/json: {schema: {$ref: "#/components/schemas/JamoStats"}}}
        "422": {$ref: "#/components/responses/Error"}
  /v1/enroll/next-prompts:
    post:
      summary: Next enrollment sentences. v1 strategy = random only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: string}
                n: {type: integer, minimum: 1, maximum: 50, default: 10}
                strategy: {type: string, enum: [random, coverage, error_based], default: random}
                seed: {type: integer, default: 0}
                exclude_prompt_ids: {type: array, items: {type: string}}
      responses:
        "200":
          description: prompts
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy: {type: string}
                  strategy_version: {type: string}
                  seed: {type: integer}
                  pool_size: {type: integer}
                  prompts:
                    type: array
                    items:
                      type: object
                      properties:
                        prompt_id: {type: string}
                        text: {type: string}
        "501": {$ref: "#/components/responses/Error"}
  /v1/enroll/recordings:
    post:
      summary: >
        Deliver one enrollment recording (backend T3). Raw WAV body, same framing and the same
        audio limits as /v1/asr/transcribe. Re-sending a prompt_id REPLACES that take - two
        recordings of one sentence cannot be split into train and gate.
      description: >
        The training label is NEVER taken from the request body. It is the canonical text of
        prompt_id in the pinned pool, so a recommended sentence cannot become a label by
        accident (backend T4). text_b64 supplies a human-reviewed transcript of what the user
        actually read; only then is the item reviewed, and /v1/adapters/train refuses
        unreviewed items unless ASR_ALLOW_UNREVIEWED is set.
      parameters:
        - {in: query, name: user_id, required: true, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}}
        - {in: query, name: prompt_id, required: true, schema: {type: string}}
        - in: query
          name: text_b64
          required: false
          schema: {type: string}
          description: >
            base64url of the UTF-8 reviewed transcript. Sent as a query value, not a path or a
            log line: the server strips the query string before logging.
      requestBody:
        required: true
        content:
          audio/wav: {schema: {type: string, format: binary}}
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollItemAccepted"}
        "400": {$ref: "#/components/responses/Error"}
        "404":
          description: unknown_prompt_id - not in the pinned pool.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
    get:
      summary: Enrollment counts and per-item provenance for one user. Returns no label text.
      parameters:
        - {in: query, name: user_id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Enrollment state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollList"}
        "400": {$ref: "#/components/responses/Error"}
    delete:
      summary: >
        Consent withdrawal for one recording: the audio file and its pair entry are both
        removed. Adapters already trained from it are NOT retired - that is a separate
        decision (backend T9), and the response states it.
      parameters:
        - {in: query, name: user_id, required: true, schema: {type: string}}
        - {in: query, name: prompt_id, required: true, schema: {type: string}}
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EnrollDeleted"}
        "400": {$ref: "#/components/responses/Error"}
        "404":
          description: unknown_prompt_id - this user has no recording for that prompt.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  /v1/adapters/train:
    post:
      summary: >
        Queue a per-user adapter training job. 202 as of 2026-10-03 (was 501). Enrollment audio
        and texts must already be readable by this server; there is no ingest route yet, so the
        backend cannot deliver them over HTTP (backend question T3, unresolved).
      parameters:
        - in: query
          name: user_id
          required: false
          schema: {type: string}
          description: "Required; may instead be sent as a JSON body field user_id."
      responses:
        "202":
          description: Job accepted. Training and the held-out gate run asynchronously.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/Error"}
        "409":
          description: >
            enrollment_unreviewed - one or more recordings have no human-reviewed transcript.
            Carries unreviewed_prompt_ids and n_unreviewed.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: >
            no_enrollment - no recordings for this user. The error carries expected_path.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/jobs/{job_id}:
    get:
      summary: Training job state. Added 2026-10-03; the backend maps these onto its own enum.
      parameters:
        - in: path
          name: job_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404":
          description: unknown_job. There is no distinction between never-existed and expired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  responses:
    Error:
      description: typed error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
                additionalProperties: true
  schemas:
    EnrollCounts:
      type: object
      properties:
        n_enrolled: {type: integer}
        n_unreviewed:
          type: integer
          description: Items whose label is the prompt text rather than a reviewed transcript.
        min_enroll:
          type: integer
          description: Policy, not evidence. The minimum enrollment count was never measured.
        min_gate: {type: integer}
        trainable:
          type: boolean
          description: Whether POST /v1/adapters/train would be accepted right now.
    EnrollItem:
      type: object
      properties:
        file: {type: string}
        prompt_id: {type: string}
        text_source:
          type: string
          enum: [prompt_pool, reviewed_transcript, manifest]
        reviewed: {type: boolean}
        audio_sha256: {type: string}
        duration_sec: {type: number}
        dbfs: {type: number}
        created_at: {type: string}
        text:
          type: string
          description: Present only in the ingest response, so the caller can see what was stored.
    EnrollItemAccepted:
      allOf:
        - $ref: "#/components/schemas/EnrollCounts"
        - type: object
          properties:
            contract_version: {type: string}
            user_id: {type: string}
            item: {$ref: "#/components/schemas/EnrollItem"}
            replaced_previous_take: {type: boolean}
            pool_version: {type: string}
            pool_sha256: {type: string}
    EnrollList:
      allOf:
        - $ref: "#/components/schemas/EnrollCounts"
        - type: object
          properties:
            contract_version: {type: string}
            user_id: {type: string}
            items:
              type: array
              items: {$ref: "#/components/schemas/EnrollItem"}
    EnrollDeleted:
      allOf:
        - $ref: "#/components/schemas/EnrollCounts"
        - type: object
          properties:
            contract_version: {type: string}
            user_id: {type: string}
            deleted_prompt_id: {type: string}
            audio_deleted: {type: boolean}
            adapters_retired:
              type: boolean
              description: Always false in v1. Retiring an adapter is a separate decision.
            note: {type: string}
    Error:
      type: object
      properties:
        contract_version: {type: string}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
    Job:
      type: object
      description: >
        A job is NOT an adapter. state=promoted means the candidate beat the incumbent on the
        held-out gate AND the active pointer was rewritten; rejected means it did not (a tie does
        not promote) and is a normal outcome, not a failure. There is no numeric progress field -
        do not synthesise one.
      required: [job_id, user_id, state, contract_version]
      properties:
        contract_version: {type: string}
        job_id: {type: string}
        user_id: {type: string}
        state:
          type: string
          enum: [queued, running, evaluating, promoted, rejected, needs_review, failed]
        created_at: {type: string}
        updated_at: {type: string}
        min_enroll:
          type: integer
          description: Policy, not evidence. The minimum enrollment count was never measured.
        min_gate: {type: integer}
        n_enroll: {type: integer}
        n_train: {type: integer}
        n_dev: {type: integer}
        n_gate: {type: integer}
        incumbent_adapter:
          type: string
          nullable: true
          description: null means the comparison was against the BASE model.
        incumbent_cer_jamo: {type: number}
        new_cer_jamo: {type: number}
        decision: {type: string}
        adapter_id:
          type: string
          nullable: true
          description: Present only when state=promoted.
        previous_active:
          type: string
          nullable: true
          description: The adapter this one replaced, kept for rollback.
        error: {type: string}
    ModelInfo:
      type: object
      required: [engine, base_model, base_revision, adapter_id, adapter_revision]
      properties:
        engine: {type: string}
        base_model: {type: string}
        base_revision: {type: string, nullable: true}
        adapter_id: {type: string, nullable: true}
        adapter_revision: {type: string, nullable: true}
    Transcription:
      type: object
      required: [contract_version, transcription_id, request_id, user_id, revision, status, text,
                 alternatives, score, score_type, model, decoding, audio, latency_ms, created_at]
      properties:
        contract_version: {type: string, example: ai-contract-v1}
        transcription_id: {type: string, format: uuid}
        request_id: {type: string}
        user_id: {type: string}
        revision: {type: integer, example: 1}
        status: {type: string, enum: [ok, no_speech]}
        text: {type: string}
        alternatives:
          type: array
          maxItems: 0
          items: {type: string}
          description: always empty in v1
        score: {type: number, nullable: true, description: always null in v1}
        score_type: {type: string, nullable: true, description: required whenever score is non-null}
        model: {$ref: "#/components/schemas/ModelInfo"}
        decoding:
          type: object
          properties:
            language: {type: string, example: ko}
            task: {type: string, example: transcribe}
            beam_size: {type: integer, example: 1}   # 1 = greedy (D9)
        audio:
          type: object
          properties:
            sha256: {type: string}
            duration_sec: {type: number}
            rms_dbfs: {type: number}
            preprocessing_version: {type: string, example: pp-v1}
        latency_ms: {type: integer}
        created_at: {type: string}
    ConfirmRequest:
      type: object
      required: [revision, confirmed_text]
      properties:
        revision: {type: integer}
        confirmed_text: {type: string, minLength: 1}
        consent:
          type: object
          properties:
            store_audio: {type: boolean, default: false}
            use_for_training: {type: boolean, default: false}
    Confirmation:
      type: object
      properties:
        confirmation_id: {type: string, format: uuid}
        transcription_id: {type: string, format: uuid}
        based_on_revision: {type: integer}
        confirmed_text: {type: string}
        text_sha256: {type: string}
        source: {type: string, enum: [asr_unedited, user_edited]}
        edit_distance_syl: {type: integer}
        consent:
          type: object
          properties:
            store_audio: {type: boolean}
            use_for_training: {type: boolean}
        supersedes: {type: string, nullable: true}
        valid: {type: boolean}
        confirmed_at: {type: string}
    Tts:
      type: object
      properties:
        tts_id: {type: string, format: uuid}
        confirmation_id: {type: string, format: uuid}
        text: {type: string}
        text_sha256: {type: string}
        engine: {type: string, example: client_speech_synthesis}
        replayed: {type: boolean}
        created_at: {type: string}
    JamoStats:
      type: object
      properties:
        metric_version: {type: string, example: jamo-err-v1}
        min_support: {type: integer}
        pairs_used: {type: integer}
        reference_tokens: {type: integer}
        insertions:
          type: array
          items:
            type: object
            properties:
              token: {type: string}
              position: {type: string, enum: [initial, medial, final]}
              count: {type: integer}
        tokens:
          type: array
          items:
            type: object
            properties:
              token: {type: string}
              position: {type: string, enum: [initial, medial, final]}
              errors: {type: integer}
              sample_count: {type: integer}
              error_rate: {type: number, nullable: true}
              status: {type: string, enum: [ok, insufficient_data]}
              silent_initial: {type: boolean}
    Health:
      type: object
      properties:
        status: {type: string}
        contract_version: {type: string}
        engine: {type: string}
        base_model: {type: string}
        base_revision: {type: string, nullable: true}
        preprocessing_version: {type: string}
        beam_size: {type: integer}
        adapters:
          type: array
          items:
            type: object
            properties:
              adapter_id: {type: string}
              user_id: {type: string}
              adapter_revision: {type: string}
              size_bytes: {type: integer}
              label: {type: string, nullable: true}
              evidence: {type: string, nullable: true}
        limits:
          type: object
          properties:
            min_sec: {type: number}
            max_sec: {type: number}
            sample_rate: {type: integer}
            channels: {type: integer}
            bits: {type: integer}
